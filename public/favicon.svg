<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">

  <!-- Dark navy background -->
  <rect width="32" height="32" rx="7" fill="#0a1720"/>

  <!-- Three lash strokes — centered in 32×32 -->
  <g transform="translate(5, 2)">

    <!-- Eyelid base -->
    <path d="M 1 27 Q 11 25.5 21 27"
          stroke="#48B8CA" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.45"/>

    <!-- Left lash -->
    <path d="M 5 26.8 Q 3 17 1 5"
          stroke="#48B8CA" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Center lash -->
    <path d="M 11 26.2 Q 10 15 10 2"
          stroke="#48B8CA" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- Right lash -->
    <path d="M 17 26.8 Q 19 17 21 5"
          stroke="#48B8CA" stroke-width="2" fill="none" stroke-linecap="round"/>

  </g>

</svg>
