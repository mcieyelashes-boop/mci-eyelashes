<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">

  <!-- Dark navy background with subtle rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0a1720"/>

  <!-- Eye outline: clean almond shape -->
  <path d="M 3 20 Q 16 12 29 20 Q 16 25 3 20 Z"
        stroke="#48B8CA" stroke-width="1.6"
        fill="none" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 3 bold lashes (simplified for favicon readability) -->
  <!-- Lash left -->
  <path d="M 8.5 17.2 Q 7 11 6 5"
        stroke="#48B8CA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Lash center -->
  <path d="M 16 14 Q 16 8 16 3"
        stroke="#48B8CA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Lash right -->
  <path d="M 23.5 17.2 Q 25 11 26 5"
        stroke="#48B8CA" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Iris -->
  <circle cx="16" cy="20" r="3"   fill="#48B8CA" opacity="0.2"/>
  <circle cx="16" cy="20" r="1.4" fill="#48B8CA"/>

</svg>
