<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 60" fill="none">
  <defs>
    <linearGradient id="gm" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#D4A843"/>
      <stop offset="38%"  stop-color="#F5DC78"/>
      <stop offset="100%" stop-color="#C09030"/>
    </linearGradient>
  </defs>

  <!-- ══ Monogram mark — 56×56, centred in 60px height ══ -->
  <g transform="translate(0,2)">

    <!-- Outer square border -->
    <rect x="2.5" y="2.5" width="51" height="51" rx="6"
          stroke="url(#gm)" stroke-width="2.5" fill="none"/>
    <!-- Inner square border -->
    <rect x="7" y="7" width="42" height="42" rx="3.5"
          stroke="url(#gm)" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- M — verticals meet at centre-V -->
    <polyline points="11,47 11,11 28,30 45,11 45,47"
              stroke="url(#gm)" stroke-width="5.5"
              fill="none" stroke-linecap="round"
              stroke-linejoin="miter" stroke-miterlimit="12"/>

    <!-- C — centre (28,28) r=12, opens right -->
    <path d="M 38.4 22 A 12 12 0 1 0 38.4 34"
          stroke="url(#gm)" stroke-width="5"
          fill="none" stroke-linecap="round"/>

    <!-- I — serif vertical bar inside C -->
    <line x1="28" y1="21" x2="28" y2="35"
          stroke="url(#gm)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="23" y1="21" x2="33" y2="21"
          stroke="url(#gm)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="23" y1="35" x2="33" y2="35"
          stroke="url(#gm)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ══ Separator ══ -->
  <line x1="66" y1="10" x2="66" y2="50"
        stroke="#E8C24A" stroke-width="0.8" opacity="0.3"/>

  <!-- ══ Wordmark ══ -->

  <!-- MCI — large, heavy -->
  <text x="78" y="34"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="800" letter-spacing="5"
        fill="#E8C24A">MCI</text>

  <!-- Thin rule between MCI and EYELASHES -->
  <line x1="79" y1="38.5" x2="205" y2="38.5"
        stroke="#E8C24A" stroke-width="0.6" opacity="0.3"/>

  <!-- EYELASHES — properly sized, tracked -->
  <text x="79.5" y="50"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="300" letter-spacing="5.5"
        fill="rgba(245,220,120,0.8)">EYELASHES</text>

</svg>
