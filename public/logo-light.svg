<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 68" fill="none">
  <defs>
    <linearGradient id="gm" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#D4A843"/>
      <stop offset="38%"  stop-color="#F5DC78"/>
      <stop offset="100%" stop-color="#C09030"/>
    </linearGradient>
  </defs>

  <!-- ══ Monogram mark — 64×64 centred in 68px height ══ -->
  <g transform="translate(0,2)">

    <!-- Outer frame -->
    <rect x="3" y="3" width="58" height="58" rx="7"
          stroke="url(#gm)" stroke-width="3" fill="none"/>
    <!-- Inner frame -->
    <rect x="8.5" y="8.5" width="47" height="47" rx="4"
          stroke="url(#gm)" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- M -->
    <polyline points="12,55 12,12 32,33 52,12 52,55"
              stroke="url(#gm)" stroke-width="6.5"
              fill="none" stroke-linecap="round"
              stroke-linejoin="miter" stroke-miterlimit="12"/>

    <!-- C — centre (32,32) r=14, opens right -->
    <path d="M 44.1 25 A 14 14 0 1 0 44.1 39"
          stroke="url(#gm)" stroke-width="5.5"
          fill="none" stroke-linecap="round"/>

    <!-- I — serif vertical bar -->
    <line x1="32" y1="24" x2="32" y2="40"
          stroke="url(#gm)" stroke-width="4" stroke-linecap="round"/>
    <line x1="26" y1="24" x2="38" y2="24"
          stroke="url(#gm)" stroke-width="3" stroke-linecap="round"/>
    <line x1="26" y1="40" x2="38" y2="40"
          stroke="url(#gm)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ══ Separator ══ -->
  <line x1="74" y1="10" x2="74" y2="58"
        stroke="#E8C24A" stroke-width="0.8" opacity="0.28"/>

  <!-- ══ Wordmark ══ -->

  <!-- MCI — big and bold -->
  <text x="86" y="38"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="900" letter-spacing="6"
        fill="#E8C24A">MCI</text>

  <!-- Hairline rule -->
  <line x1="87" y1="43" x2="224" y2="43"
        stroke="#E8C24A" stroke-width="0.6" opacity="0.28"/>

  <!-- EYELASHES — clearly readable -->
  <text x="87.5" y="57"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="400" letter-spacing="6"
        fill="rgba(245,220,120,0.85)">EYELASHES</text>

</svg>
