<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 44" fill="none">

  <!-- ── Lash mark (translated into 44×44 icon area) ── -->
  <g transform="translate(4, 2)">

    <!-- Eyelid base arc — subtle teal, low opacity -->
    <path d="M 3 36 Q 18 34 33 36"
          stroke="#48B8CA" stroke-width="1.2"
          fill="none" stroke-linecap="round" opacity="0.45"/>

    <!-- Left lash — fans outward -->
    <path d="M 9 35.4 Q 6 19 3 4"
          stroke="#48B8CA" stroke-width="2.2"
          fill="none" stroke-linecap="round"/>

    <!-- Center lash — tallest, slightly thicker -->
    <path d="M 18 35 Q 17 18 17 2"
          stroke="#48B8CA" stroke-width="2.6"
          fill="none" stroke-linecap="round"/>

    <!-- Right lash — fans outward -->
    <path d="M 27 35.4 Q 30 19 33 4"
          stroke="#48B8CA" stroke-width="2.2"
          fill="none" stroke-linecap="round"/>

  </g>

  <!-- ── Separator ── -->
  <line x1="54" y1="9" x2="54" y2="35"
        stroke="#48B8CA" stroke-width="0.75" opacity="0.3"/>

  <!-- ── Wordmark ── -->
  <!-- MCI — heavy, modern -->
  <text x="64" y="28"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="800"
        letter-spacing="4"
        fill="#ffffff">MCI</text>

  <!-- EYELASHES — ultra-light, tracked -->
  <text x="65.5" y="37.5"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="6.5" font-weight="300"
        letter-spacing="4"
        fill="rgba(121,207,221,0.8)">EYELASHES</text>

</svg>
