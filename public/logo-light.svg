<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 286 82" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MCI Eyelashes</title>
  <desc id="desc">Elegant gold MCI Eyelashes wordmark with a lash-inspired monogram.</desc>
  <defs>
    <linearGradient id="gold" x1="12" y1="7" x2="82" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF0A8"/>
      <stop offset="0.35" stop-color="#E7C75A"/>
      <stop offset="0.72" stop-color="#B98624"/>
      <stop offset="1" stop-color="#F4D875"/>
    </linearGradient>
    <linearGradient id="teal" x1="10" y1="74" x2="94" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48B8CA"/>
      <stop offset="1" stop-color="#9CE7EF"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.74 0 0 1 0 0.22 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <path d="M13 43C22 24 39 13 58 13C76 13 90 22 99 38" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M19 48C32 60 50 66 69 61C82 58 93 50 101 39" stroke="url(#teal)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <path d="M30 44C35 52 42 56 51 57" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 41C48 51 58 55 70 52" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M55 37C63 48 75 49 88 42" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M37 26V55M37 26L55 48L73 26V55" stroke="url(#gold)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M89 30C83 22 72 18 61 21C49 24 41 35 43 47C45 59 57 66 70 63C78 61 84 56 88 50" stroke="url(#gold)" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M61 32V53M54 32H68M54 53H68" stroke="url(#teal)" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <path d="M118 16V66" stroke="#E8C24A" stroke-width="1" opacity="0.28"/>

  <text x="134" y="40"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="31" font-weight="800" letter-spacing="7"
        fill="#F0D36B">MCI</text>
  <path d="M135 47H276" stroke="#E8C24A" stroke-width="0.8" opacity="0.32"/>
  <text x="135" y="63"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="10.5" font-weight="500" letter-spacing="5.7"
        fill="#F7E7A4">EYELASHES</text>
</svg>
